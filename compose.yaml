version: "3.8"

services:
  frontend:
    build:
      context: ./todo-fronted
    ports:
      - "3000:3000"
    stdin_open: true
    depends_on:
      - backend
    networks:
      - react-express

  backend:
    build:
      context: ./todo-backend
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    environment:
      - MONGO_URI=${MONGO_URI}
      - PORT=5000
    networks:
      - react-express

  mongo:
    image: mongo:6
    restart: always
    ports:
      - "27017:27017"
    networks:
      - react-express

networks:
  react-express:
    driver: bridge